[project]
name = "agentic-software-engineering-crew"
version = "0.1.0"
description = "A multi-agent software engineering platform that generates and tests Flask applications from natural-language requirements."
authors = [
    { name = "Navid Hejazi" }
]
requires-python = ">=3.11,<3.13"

dependencies = [
    "boto3>=1.43.57",
    "crewai[litellm,tools]==1.9.3",
    "flask>=3.1,<4.0",
    "gunicorn>=23.0,<24.0",
    "pytest>=8.0,<10.0",
    "python-dotenv>=1.1,<2.0",
]

[project.scripts]
agentic_software_engineering_crew = "agentic_software_engineering_crew.main:run"
run_crew = "agentic_software_engineering_crew.main:run"
train = "agentic_software_engineering_crew.main:train"
replay = "agentic_software_engineering_crew.main:replay"
test = "agentic_software_engineering_crew.main:test"
run_with_trigger = "agentic_software_engineering_crew.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_software_engineering_crew"]

[tool.crewai]
type = "crew"
